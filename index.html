<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berry Run – Elige cómo jugar</title>
<meta name="description" content="Berry Run: carrera educativa. Juega offline en tu dispositivo o en vivo con toda la clase usando un código.">
<meta name="theme-color" content="#f7f0e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#160c20" media="(prefers-color-scheme: dark)">
<link rel="preload" href="assets/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(assets/fonts/bricolage-latin.woff2) format('woff2')}
:root{color-scheme:light dark;
  --paper:#f7f0e3;--paper-2:#eee3cf;--surface:#fffaf1;--ink:#2a1535;--ink-2:#65507a;--line:rgba(42,21,53,.14);
  --berry:#d6275a;--berry-ink:#d6275a;--sun:#ffc533;--focus:#3d4fd1;
  --ease:cubic-bezier(.23,1,.32,1);--font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sh-2:0 2px 4px rgba(42,21,53,.08),0 14px 28px -10px rgba(42,21,53,.28)}
@media (prefers-color-scheme:dark){:root{--paper:#160c20;--paper-2:#1e1230;--surface:#2a1a3b;--ink:#fbeeff;--ink-2:#c6abd9;--line:rgba(251,238,255,.14);--berry-ink:#ff7aa3;--focus:#ffd45e;
  --sh-2:0 2px 4px rgba(0,0,0,.35),0 14px 28px -10px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-weight:500;color:var(--ink);background:var(--paper);background-image:radial-gradient(120% 70% at 50% -10%,var(--surface) 0%,transparent 60%),linear-gradient(180deg,transparent 40%,var(--paper-2) 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
main{width:100%;max-width:880px;display:flex;flex-direction:column;gap:32px;align-items:center;text-align:center}
h1{margin:0;font-size:clamp(3.5rem,11vw,6rem);line-height:.92;font-weight:800;letter-spacing:-.035em}
h1 span{color:var(--berry-ink)}
.sub{margin:0;font-size:1.25rem;color:var(--ink-2);max-width:36ch;text-wrap:balance}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.choice{display:flex;flex-direction:column;gap:8px;text-align:left;padding:24px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),var(--sh-2);color:inherit;text-decoration:none;
  animation:rise .42s var(--ease) both;transition:transform .16s var(--ease),box-shadow .2s var(--ease)}
.choice:nth-child(2){animation-delay:.07s}
.choice h2{margin:0;font-size:1.75rem;line-height:1.05;font-weight:800;letter-spacing:-.025em}
.choice p{margin:0;color:var(--ink-2);line-height:1.45}
.choice .go{margin-top:16px;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:14px;font-weight:800;color:#fff;background:var(--berry);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 8px 16px -8px rgba(168,27,69,.65);align-self:flex-start}
.choice.alt .go{background:var(--sun);color:#2a1535;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(150,95,0,.28),0 8px 16px -8px rgba(217,154,0,.7)}
.choice:active{transform:scale(.98)}
@media (hover:hover){.choice:hover{transform:translateY(-3px)}}
.choice:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:640px){.choices{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<main>
  <div>
    <h1>Berry <span>Run</span></h1>
  </div>
  <p class="sub">Corre, salta y atrapa bayas. Cada baya trae una pregunta de la clase.</p>
  <div class="choices">
    <a class="choice" href="online/">
      <h2>Online</h2>
      <p>Entra con el código de tu profesor y compite en vivo con toda la clase, a la vez.</p>
      <span class="go">Jugar online</span>
    </a>
    <a class="choice alt" href="offline/">
      <h2>Offline</h2>
      <p>Un solo dispositivo, sin internet, con competidores simulados. Ideal para practicar.</p>
      <span class="go">Jugar offline</span>
    </a>
  </div>
</main>
</body>
</html>
